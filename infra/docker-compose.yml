# =====================================================================
# PLATTFORMSFIL: ändra denna fil med försiktighet. Se DRIFT.md.
# Er deploy-miljö (stage/prod) kräver att:
#   1. filen ligger kvar som infra/docker-compose.yml
#   2. webbtjänsten heter "app"
#   3. "expose" används här, aldrig "ports"
#      (lokala portar: se docker-compose.override.yml)
#   4. appens lyssningsport matchar expose-värdet
# En automatisk kontroll (.github/workflows/infra-guard.yml) ger rött X
# på push som bryter mot regel 1-3.
# =====================================================================
# version: "3.8"
name: nordiska

services:
  secrets-init:
    image: alpine:3.19
    volumes:
      - db_secret:/secrets
    entrypoint: ["/bin/sh", "-c", "test -f /secrets/db_password || (head -c 24 /dev/urandom | base64 > /secrets/db_password)"]

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: nordiska
      POSTGRES_USER: nordiska
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - db_secret:/run/secrets:ro
    expose:
      - "5432"
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nordiska"]
      interval: 5s
      timeout: 5s
      retries: 5

  # v2 backend (NordiskaPortal.API). JWT-nyckel och DB-lösenord hårdkodas
  # Inte här utan de genereras och sparas i egna volymer vid första starten.
  # Se GetOrCreateSigningKey/AddDatabase i ServiceCollectionExtensions.cs
  # och secrets-init-tjänsten ovan.
    
  # The platform requires the web service to be named "app" (see DRIFT.md).
  app:
    build:
      context: ..
      dockerfile: backend/NordiskaPortal.API/Dockerfile
    expose:
      - "8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=nordiska;Username=nordiska
      - Jwt__Issuer=NordiskaPortal.API
      - Jwt__Audience=NordiskaPortal.Client
      - Cors__AllowedOrigins__0=http://localhost:5173
      - Cors__AllowedOrigins__1=http://localhost:5077
      - Cors__AllowedOrigins__2=https://nordiska-team3.team.chas-challenge.comerit.se
      - Cors__AllowedOrigins__3=https://nordiska-team3-dev.team.chas-challenge.comerit.se
    volumes:
      - api_secrets:/secrets
      - db_secret:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  api_secrets:
  db_secret:
