# =====================================================================
# PLATTFORMSFIL: ändra denna fil med försiktighet. Se DRIFT.md.
# Er deploy-miljö (stage/prod) kräver att:
#   1. filen ligger kvar som infra/docker-compose.yml
#   2. webbtjänsten heter "app"
#   3. "expose" används här, aldrig "ports"
#      (lokala portar: se docker-compose.override.yml)
#   4. appens lyssningsport matchar expose-värdet
# En automatisk kontroll (.github/workflows/infra-guard.yml) ger rött X
# på push som bryter mot regel 1-3.
# =====================================================================
# version: "3.8"
name: nordiska

services:
  db:
    image: postgres:12
    environment:
      POSTGRES_DB: nordiska
      POSTGRES_USER: nordiska
      POSTGRES_PASSWORD: nordiska123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nordiska"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ../backend/NordiskaPortal
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      db:
        condition: service_healthy

  # v2 backend (NordiskaPortal.API). Local dev key below, NOT a production secret
  # (same principle as the db password above) - real secret management is a separate, later step.
  api:
    build:
      context: ..
      dockerfile: backend/NordiskaPortal.API/Dockerfile
    expose:
      - "5077"
    environment:
      - ASPNETCORE_URLS=http://+:5077
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=nordiska;Username=nordiska;Password=nordiska123
      - Jwt__Issuer=NordiskaPortal.API
      - Jwt__Audience=NordiskaPortal.Client
      - Jwt__Key=local-dev-only-key-do-not-use-in-prod-3f8a9c2e1b7d4f6a
      - Cors__AllowedOrigins__0=http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
